<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 15 - All Selector Types</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 25px; }
    h1, h2 { color: #334155; }
    #title { text-align: center; }
    .card { background: #fef3c7; padding: 15px; border-radius: 8px; margin: 10px 0; }
    div p { color: #7c3aed; }
    ul > li { color: #16a34a; }
    input[type="text"] { border: 2px solid #22c55e; padding: 8px; }
  </style>
</head>
<body>
  <h1 id="title">Selector Practice</h1>
  <div class="card">
    <h2>Card Heading</h2>
    <p>Descendant selector.</p>
  </div>

  <ul>
    <li>Child item</li>
    <li>Another item</li>
  </ul>

  <input type="text" placeholder="Type here" />
</body>
</html>
