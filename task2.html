<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 2 - Internal CSS</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef7ff; text-align: center; }
    h1 { color: #0f3d5e; }
    p { color: #1f2937; font-size: 18px; }
    button {
      background: #0f3d5e; color: #fff; border: none;
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Internal CSS Example</h1>
  <p>This page uses internal CSS to style the heading, paragraph, and button.</p>
  <button>Click Me</button>
</body>
</html>
