<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 22 - Motivational Quote</title>
  <style>
    body { background: #fff7ed; font-family: Georgia, serif; padding: 40px; }
    blockquote {
      font-size: 30px;
      font-style: italic;
      color: #7c2d12;
      text-align: center;
      border-left: 6px solid #f59e0b;
      padding-left: 20px;
    }
    span { display: block; font-weight: bold; margin-top: 12px; }
  </style>
</head>
<body>
  <blockquote>
    “Success is the sum of small efforts repeated day in and day out.”
    <span>— Robert Collier</span>
  </blockquote>
</body>
</html>
