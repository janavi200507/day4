<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 25 - Text Formatting Showcase</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    h1 { text-align: center; color: #1d3557; }
    .box { background: #f1f5f9; padding: 20px; margin: 12px 0; border-radius: 8px; }
    .bold { font-weight: bold; }
    .italic { font-style: italic; }
    .underline { text-decoration: underline; }
    .upper { text-transform: uppercase; }
    .lower { text-transform: lowercase; }
    .cap { text-transform: capitalize; }
    .shadow { text-shadow: 2px 2px 6px rgba(0,0,0,0.25); }
    .space { letter-spacing: 2px; }
  </style>
</head>
<body>
  <h1>Text Formatting Showcase</h1>
  <div class="box"><span class="bold">Bold</span> text</div>
  <div class="box"><span class="italic">Italic</span> text</div>
  <div class="box"><span class="underline">Underlined</span> text</div>
  <div class="box"><span class="upper">uppercase text</span></div>
  <div class="box"><span class="lower">LOWERCASE TEXT</span></div>
  <div class="box"><span class="cap">capitalize this sentence</span></div>
  <div class="box"><span class="shadow space">Shadow and spacing</span></div>
</body>
</html>
