<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 28 - Border Styles</title>
  <style>
    .solid { border: 3px solid #2563eb; padding: 20px; margin: 10px; }
    .dashed { border: 3px dashed #f59e0b; padding: 20px; margin: 10px; }
    .dotted { border: 3px dotted #16a34a; padding: 20px; margin: 10px; }
  </style>
</head>
<body>
  <div class="solid">Solid</div>
  <div class="dashed">Dashed</div>
  <div class="dotted">Dotted</div>
</body>
</html>
