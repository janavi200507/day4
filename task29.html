<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 29 - Margins</title>
  <style>
    .box { width: 200px; background: #dcfce7; border: 2px solid #15803d; }
    .m1 { margin: 10px; }
    .m2 { margin: 20px 30px; }
    .m3 { margin: 40px 10px 20px 50px; }
  </style>
</head>
<body>
  <div class="box m1">Margin 10px</div>
  <div class="box m2">Margin 20px 30px</div>
  <div class="box m3">Margin 40px 10px 20px 50px</div>
</body>
</html>
