<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 30 - Profile Card</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; }
    .card {
      width: 260px;
      background: white;
      padding: 20px;
      border: 1px solid #d1d5db;
      margin: 40px auto;
      border-radius: 12px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      background: #60a5fa;
      border-radius: 50%;
      margin: 0 auto 15px;
    }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <h2>Jane Doe</h2>
    <p>Designer & Developer</p>
  </div>
</body>
</html>
