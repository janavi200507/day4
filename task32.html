<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 32 - Rounded Buttons</title>
  <style>
    button {
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 10px;
    }
    .btn1 { background: #3498db; border-radius: 5px; }
    .btn2 { background: #2ecc71; border-radius: 15px; }
    .btn3 { background: #e74c3c; border-radius: 30px; }
  </style>
</head>
<body>
  <button class="btn1">Small</button>
  <button class="btn2">Medium</button>
  <button class="btn3">Large</button>
</body>
</html>
