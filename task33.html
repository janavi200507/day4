<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 33 - Box Shadows</title>
  <style>
    .card {
      width: 220px;
      background: white;
      padding: 20px;
      margin: 30px;
      border-radius: 12px;
    }
    .shadow1 { box-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
    .shadow2 { box-shadow: 0 0 20px rgba(59,130,246,0.5); }
  </style>
</head>
<body>
  <div class="card shadow1">Light shadow</div>
  <div class="card shadow2">Blue glow</div>
</body>
</html>
