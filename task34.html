<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 34 - Product Card</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ecf0f1; }
    .product {
      width: 260px;
      background: white;
      padding: 20px;
      border: 1px solid #d5dbdb;
      margin: 50px auto;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }
    .image {
      width: 100%;
      height: 160px;
      background: linear-gradient(#f8c471, #f5b7b1);
      border-radius: 10px;
      margin-bottom: 15px;
    }
    h3 { margin: 0 0 8px; }
    p { margin: 0 0 15px; }
    .price { font-weight: bold; color: #1e8449; }
  </style>
</head>
<body>
  <div class="product">
    <div class="image"></div>
    <h3>Wireless Headphones</h3>
    <p>Premium sound and comfort.</p>
    <div class="price">$89.99</div>
  </div>
</body>
</html>
