<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 35 - Card Styles</title>
  <style>
    body {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 30px;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 150px;
      padding: 20px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
    }
    .one { box-shadow: 2px 2px 8px #999; }
    .two { border-style: dashed; box-shadow: 0 0 12px #f1c40f; }
    .three { border-style: dotted; box-shadow: 5px 5px 12px rgba(0,0,0,0.2); }
    .four { border: 2px solid #3498db; box-shadow: 0 8px 20px rgba(52,152,219,0.4); }
    .five { border: 2px solid #e74c3c; box-shadow: inset 0 0 15px rgba(231,76,60,0.4); }
  </style>
</head>
<body>
  <div class="card one">Card 1</div>
  <div class="card two">Card 2</div>
  <div class="card three">Card 3</div>
  <div class="card four">Card 4</div>
  <div class="card five">Card 5</div>
</body>
</html>
