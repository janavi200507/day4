<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 36 - Positioning</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .wrap { position: relative; background: #f5f5f5; padding: 20px; border: 1px solid #ccc; }
    .box { width: 120px; height: 120px; margin: 10px; display: inline-block; background: #82ccdd; }
    .relative { position: relative; left: 30px; top: 10px; }
    .absolute { position: absolute; left: 200px; top: 35px; background: #f7b267; }
    .fixed { position: fixed; right: 20px; bottom: 20px; background: #5dade2; }
    .sticky { position: sticky; top: 10px; background: #a9dfbf; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">Static</div>
    <div class="box relative">Relative</div>
    <div class="box absolute">Absolute</div>
  </div>
  <div class="box sticky">Sticky</div>
  <div class="box fixed">Fixed</div>
  <p>Scroll to see sticky behavior.</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
  <p>More content...</p>
</body>
</html>
