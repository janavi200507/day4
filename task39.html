<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 39 - Notification Badge</title>
  <style>
    .container {
      position: relative;
      display: inline-block;
      margin: 40px;
    }
    .icon { width: 70px; height: 70px; background: #e5e7eb; border-radius: 10px; }
    .badge {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #e74c3c;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"></div>
    <div class="badge">3</div>
  </div>
</body>
</html>
