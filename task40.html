<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 40 - Overlay Text</title>
  <style>
    .image-box {
      position: relative;
      width: 500px;
      height: 300px;
      background: linear-gradient(#a7d8ff, #5dade2);
    }
    .text-overlay {
      position: absolute;
      left: 20px;
      bottom: 20px;
      color: white;
      font-size: 32px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="image-box">
    <div class="text-overlay">Beautiful Nature</div>
  </div>
</body>
</html>
