<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 41 - Floating Chat Button</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .chat-btn {
      position: fixed;
      right: 25px;
      bottom: 25px;
      width: 60px;
      height: 60px;
      background: #22c55e;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Need help?</h1>
  <p>Floating chat button fixed in the corner.</p>
  <div class="chat-btn">✦</div>
</body>
</html>
