<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 42 - All Positioning</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    .nav { position: sticky; top: 0; background: #2c3e50; color: white; padding: 15px; }
    .container { position: relative; height: 500px; background: #ecf0f1; margin: 20px; }
    .static-box { position: static; background: #85c1e9; width: 100px; height: 100px; margin: 20px; }
    .relative-box { position: relative; left: 50px; background: #f5b7b1; width: 100px; height: 100px; margin: 20px; }
    .absolute-box { position: absolute; right: 20px; top: 20px; background: #abebc6; width: 100px; height: 100px; }
    .fixed-box { position: fixed; bottom: 20px; right: 20px; background: #d2b4de; width: 100px; height: 100px; }
  </style>
</head>
<body>
  <div class="nav">Navigation Bar</div>
  <div class="container">
    <div class="static-box">Static</div>
    <div class="relative-box">Relative</div>
    <div class="absolute-box">Absolute</div>
  </div>
  <div class="fixed-box">Fixed</div>
</body>
</html>
