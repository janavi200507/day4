<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 5 - CSS Methods</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 30px; }
    .internal { border: 2px solid #64748b; padding: 20px; border-radius: 10px; margin: 20px 0; }
    h2 { color: #1d4ed8; }
  </style>
  <link rel="stylesheet" href="task5.css" />
</head>
<body>
  <h1 style="color: darkred;">Inline CSS</h1>

  <div class="internal">
    <h2>Internal CSS</h2>
    <p>This section uses internal CSS.</p>
  </div>

  <div class="external">
    <h3>External CSS</h3>
    <p>This section uses an external stylesheet.</p>
  </div>
</body>
</html>
